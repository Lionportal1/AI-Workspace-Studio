name: Publish release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version in ai_workspace_portable.py
        required: true
        type: string
      prerelease:
        description: Prerelease
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Validate source and release files
        env:
          TARGET_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          python -c 'import os,ai_workspace_portable as w;assert w.VERSION==os.environ["TARGET_VERSION"]'
          python scripts/audit_sources.py
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/build_release.py --output dist
  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: write
    concurrency:
      group: publish-${{ inputs.version }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Build and validate assets
        env:
          TARGET_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import os,ai_workspace_portable as w;assert w.VERSION==os.environ["TARGET_VERSION"]'
          if gh release view "v$TARGET_VERSION" >/dev/null 2>&1; then echo 'Release exists' >&2; exit 1; fi
          if git rev-parse -q --verify "refs/tags/v$TARGET_VERSION" >/dev/null; then echo 'Tag exists' >&2; exit 1; fi
          python scripts/build_release.py --output dist
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Publish approved release
        env:
          TARGET_VERSION: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          note="$(mktemp)"
          printf 'AI Workspace Studio v%s: Windows, macOS and Linux installers; 50 built-in skills; SHA256 checksums.\n' "$TARGET_VERSION" > "$note"
          args=(--draft --title "AI Workspace Studio v$TARGET_VERSION" --target "$GITHUB_SHA" --notes-file "$note")
          if [[ "$IS_PRERELEASE" == 'true' ]]; then args+=(--prerelease); fi
          gh release create "v$TARGET_VERSION" dist/* "${args[@]}"
          gh release edit "v$TARGET_VERSION" --draft=false
