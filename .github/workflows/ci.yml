name: CI
on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cross-platform:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python
        run: python -m compileall -q ai_workspace_portable.py lib scripts tests
      - name: Verify skills
        run: python scripts/audit_sources.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build and compare reproducible packages
        shell: bash
        run: |
          python scripts/build_release.py --output dist
          python scripts/build_release.py --output dist-compare
          python -c 'import hashlib,pathlib; a=pathlib.Path("dist");b=pathlib.Path("dist-compare");assert {p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in a.iterdir()}=={p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in b.iterdir()}'
      - name: Bash smoke test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n ai-workspace-setup.sh
          bash ai-workspace-setup.sh --version
      - name: Native PowerShell 7 tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './setup-windows.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          & ./setup-windows.ps1 --version
          $ps = Get-ChildItem dist/*Windows-Standalone.ps1 | Select-Object -First 1
          & $ps.FullName --version
      - name: Windows PowerShell 5.1 tests
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & ./setup-windows.ps1 --version
          & ./setup-windows.ps1 --list-profiles
  bash-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - shell: bash
        run: bash tests/test_cli.sh
      - name: ShellCheck
        shell: bash
        run: shellcheck -s bash ai-workspace-setup.sh tests/test_cli.sh
